name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENT_API_KEY: ci-smoke-key-not-for-production
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      AUTO_SUBMIT_ENABLED: "false"
      MCP_SERVERS_CONFIG: ./config/mcp-servers.test.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jobkar-official/nvoid_ai_agent
          ref: feat/federated-mcp-research
          path: agent-worker
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build the UI
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Build the real agent worker
        working-directory: agent-worker
        run: |
          npm ci
          npm run build
      - name: Start agent and verify its demo source
        shell: bash
        run: |
          set -euo pipefail
          (cd agent-worker && npm run start:prod > /tmp/nvoid-agent.log 2>&1) &
          agent_pid=$!
          cleanup() {
            if kill -0 "$agent_pid" 2>/dev/null; then kill "$agent_pid" || true; fi
            if [ -n "${ui_pid:-}" ] && kill -0 "$ui_pid" 2>/dev/null; then kill "$ui_pid" || true; fi
            wait "$agent_pid" 2>/dev/null || true
            if [ -n "${ui_pid:-}" ]; then wait "$ui_pid" 2>/dev/null || true; fi
            cat /tmp/nvoid-agent.log
            if [ -f /tmp/nvoid-web.log ]; then cat /tmp/nvoid-web.log; fi
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3100/api/health > /tmp/agent-health.json 2>/dev/null; then break; fi
            if ! kill -0 "$agent_pid" 2>/dev/null; then cat /tmp/nvoid-agent.log; exit 1; fi
            sleep 1
          done
          node -e 'const h=require("/tmp/agent-health.json"); if(h.status!=="ok" || !h.mcp || h.mcp.connected<1) process.exit(1); console.log("Agent healthy with "+h.mcp.connected+" connected MCP source(s)")'
          NVOID_AGENT_URL=http://127.0.0.1:3100 NVOID_AGENT_API_KEY="$AGENT_API_KEY" npm run start > /tmp/nvoid-web.log 2>&1 &
          ui_pid=$!
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/api/agent/health > /tmp/web-agent-health.json 2>/dev/null; then break; fi
            if ! kill -0 "$ui_pid" 2>/dev/null; then cat /tmp/nvoid-web.log; exit 1; fi
            sleep 1
          done
          node -e 'const h=require("/tmp/web-agent-health.json"); if(h.status!=="ok" || !h.mcp || h.mcp.connected<1) process.exit(1); console.log("UI server-side health proxy is connected")'
          sources_response=$(curl --silent --show-error --fail http://127.0.0.1:3000/api/agent/sources)
          printf '%s' "$sources_response" > /tmp/ui-sources.json
          node -e 'const r=require("/tmp/ui-sources.json"); if(!Array.isArray(r.servers) || !r.servers.some(s=>s.id==="demo" && s.connected)) { console.error(JSON.stringify(r)); process.exit(1); } console.log("UI connector inventory passed: "+r.servers.length+" source status record(s) returned")'
          research_tools_response=$(curl --silent --show-error --fail http://127.0.0.1:3000/api/research/tools)
          printf '%s' "$research_tools_response" > /tmp/ui-research-tools.json
          node -e 'const r=require("/tmp/ui-research-tools.json"); if(!Array.isArray(r.availableReadOnlyTools) || !r.availableReadOnlyTools.some(t=>t.serverId==="demo" && t.name==="search_jobs")) { console.error(JSON.stringify(r)); process.exit(1); } console.log("UI research tool inventory passed: "+r.availableReadOnlyToolCount+" read-only tool(s) discovered")'
          research_response=$(curl --silent --show-error --fail http://127.0.0.1:3000/api/research/run -H 'content-type: application/json' -d '{"query":"Software Developer jobs","serverIds":["demo"],"maxRecords":10,"maxTools":5}')
          printf '%s' "$research_response" > /tmp/ui-research.json
          node -e 'const r=require("/tmp/ui-research.json"); if(!Array.isArray(r.records) || r.records.length<1 || !Array.isArray(r.calls) || !r.calls.some(c=>c.serverId==="demo" && c.status==="success") || !r.report || r.report.uniqueRecords<1) { console.error(JSON.stringify(r)); process.exit(1); } console.log("UI-to-agent federated research passed: "+r.report.uniqueRecords+" actual MCP records from "+r.report.successfulCalls+" successful call(s)")'
          response=$(curl --silent --show-error --fail http://127.0.0.1:3000/api/agent/search -H 'content-type: application/json' -d '{"profile":{"userId":"nvoid-demo-candidate-001","jobTitle":"Software Developer","location":"Worldwide","skills":["TypeScript","Java","Spring Boot"],"keywords":["backend","remote"],"employmentTypes":["full-time"]},"limit":20,"serverIds":["demo"],"syncToBackend":false}')
          printf '%s' "$response" > /tmp/ui-search.json
          node -e 'const r=require("/tmp/ui-search.json"); if(!Array.isArray(r.jobs) || r.jobs.length<1) { console.error(JSON.stringify(r)); process.exit(1); } console.log("UI-to-agent job search passed: "+r.jobs.length+" demo jobs returned through the authenticated proxy")'
          run_response=$(curl --silent --show-error --fail http://127.0.0.1:3000/api/agent/run -H 'content-type: application/json' -d '{"userId":"nvoid-demo-candidate-001","profile":{"userId":"nvoid-demo-candidate-001","jobTitle":"Software Developer","location":"Worldwide","skills":["TypeScript","Java","Spring Boot"],"keywords":["backend","remote"],"employmentTypes":["full-time"]},"searchLimit":20,"applyLimit":2,"minMatchScore":0,"serverIds":["demo"],"autoSubmit":false,"syncToBackend":false}')
          printf '%s' "$run_response" > /tmp/ui-run.json
          node -e 'const r=require("/tmp/ui-run.json"); if(!r.applicationQueue || (r.applicationQueue.queued ?? 0)<1 || r.autoSubmitRequested!==false) { console.error(JSON.stringify(r)); process.exit(1); } console.log("UI-to-agent run passed: "+r.applicationQueue.queued+" task(s) queued; auto-submit remains disabled")'
          tasks_response=$(curl --silent --show-error --fail http://127.0.0.1:3000/api/agent/applications)
          printf '%s' "$tasks_response" > /tmp/ui-tasks.json
          node -e 'const r=require("/tmp/ui-tasks.json"); const tasks=Array.isArray(r)?r:(Array.isArray(r.tasks)?r.tasks:[]); if(tasks.length<1) { console.error(JSON.stringify(r)); process.exit(1); } console.log("UI application tracker passed: "+tasks.length+" task record(s) returned")'
